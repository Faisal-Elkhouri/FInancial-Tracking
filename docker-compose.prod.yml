# Production stack: Postgres + the Phoenix app built as a slim OTP release
# (using the generated Dockerfile). Runs migrations on boot, then the server.
#
#   cp .env.example .env
#   # set SECRET_KEY_BASE (mix phx.gen.secret) and a real DATABASE_PASSWORD
#   docker compose -f docker-compose.prod.yml up --build -d
#
# Then visit http://localhost:4000.

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
      POSTGRES_DB: ${DATABASE_NAME:-financial_tracking_prod}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    # Apply migrations, then hand off to the release's server script.
    command: sh -c "/app/bin/migrate && /app/bin/server"
    environment:
      DATABASE_URL: ecto://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD}@db/${DATABASE_NAME:-financial_tracking_prod}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?generate one with `mix phx.gen.secret` and put it in .env}
      PHX_HOST: ${PHX_HOST:-localhost}
      PORT: 4000
      PHX_SERVER: "true"
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata_prod:
